<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light;
        font-family: "Source Sans Pro", sans-serif;
        color: #172033;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .dropzone {
        box-sizing: border-box;
        min-height: 78px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: 1px dashed #aebbc9;
        border-radius: 12px;
        background: #f7f9fc;
        text-align: center;
        transition: border-color 120ms ease, background 120ms ease;
      }

      .dropzone.dragging {
        border-color: #3182ce;
        background: #edf6ff;
      }

      .dropzone strong {
        font-size: 15px;
        font-weight: 600;
      }

      .dropzone span {
        color: #64748b;
        font-size: 13px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0 2px;
      }

      button {
        box-sizing: border-box;
        min-width: 0;
        height: 40px;
        flex: 1 1 0;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #1e293b;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
      }

      button:hover:not(:disabled) {
        border-color: #64748b;
        background: #f8fafc;
      }

      button.primary {
        border-color: #1677d2;
        background: #1677d2;
        color: #fff;
      }

      button.primary:hover:not(:disabled) {
        border-color: #1268bb;
        background: #1268bb;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="picker.js"></script>
  </body>
</html>
